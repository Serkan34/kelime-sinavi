<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Deck</title>
<meta name="theme-color" content="#3347ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Deck">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: tek sütun, telefon öncelikli. Kelime ekranın ortasında dev tipografi, şıklar altta.
   Koyu mürekkep + kobalt vurgu; doğru/yanlış/pas için ayrı anlam renkleri. */
:root {
  --bg: #eef1f8;
  --surface: #ffffff;
  --ink: #151a30;
  --muted: #5d6584;
  --line: #d9deed;
  --accent: #3347ff;
  --accent-ink: #ffffff;
  --ok: #0f7a55;
  --ok-bg: #dcf3ea;
  --bad: #c0322a;
  --bad-bg: #fbe3e0;
  --skip: #8a6400;
  --skip-bg: #fbf0cf;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #181c32; --ink: #eceffd; --muted: #9aa3c7; --line: #2a3052;
    --accent: #7b8bff; --accent-ink: #0e1120;
    --ok: #4fd1a0; --ok-bg: #12362b; --bad: #ff8a80; --bad-bg: #3e1c1f; --skip: #f0c75a; --skip-bg: #3a3012;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #181c32; --ink: #eceffd; --muted: #9aa3c7; --line: #2a3052;
  --accent: #7b8bff; --accent-ink: #0e1120;
  --ok: #4fd1a0; --ok-bg: #12362b; --bad: #ff8a80; --bad-bg: #3e1c1f; --skip: #f0c75a; --skip-bg: #3a3012;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, p { margin: 0; }

#app {
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 28px;
  display: flex;
  flex-direction: column;
}

/* ---------- Ana ekran ---------- */
.home { display: flex; flex-direction: column; gap: 26px; flex: 1; }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 12vw, 58px);
  line-height: 1;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin-top: 8px;
}
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.snd {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 99px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-size: 14px; font-weight: 600;
}
.snd svg { width: 18px; height: 18px; }
.snd[aria-pressed="false"] { color: var(--muted); }
.label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.levels { display: flex; flex-direction: column; gap: 8px; }
.lv {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 10px 16px 10px 12px;
  min-height: 62px;
  transition: border-color .15s, background .15s;
}
.lv .code { font-family: var(--font-display); font-weight: 800; font-size: 32px; letter-spacing: -0.02em; }
.lv .nm { font-weight: 600; }
.lv .best { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lv[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lv[aria-checked="true"] .best { color: inherit; opacity: .85; }
.counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cnt {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 12px;
  min-height: 52px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}
.cnt[aria-checked="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 14px;
  min-height: 56px;
  padding: 0 20px;
  font-weight: 700;
  font-size: 17px;
}
.ghost {
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 14px;
  min-height: 52px;
  padding: 0 20px;
  font-weight: 600;
}
.home .primary { margin-top: auto; }

/* ---------- Test ekranı ---------- */
.quiz { display: flex; flex-direction: column; flex: 1; gap: 12px; }
.qhead { display: flex; align-items: center; gap: 12px; }
.qhead .exit { background: none; border: 0; padding: 8px 4px; font-weight: 600; color: var(--muted); min-height: 44px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.qcount { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 54px; text-align: right; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px 0; min-height: 200px; }
.tag { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); border: 1.5px solid var(--line); border-radius: 99px; padding: 2px 12px; }
.word {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(44px, 14vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.spk {
  width: 44px; height: 44px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--bg); border: 1.5px solid var(--line); color: var(--muted);
}
.spk svg { width: 20px; height: 20px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px;
  text-align: left;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 14px;
  min-height: 58px;
  padding: 8px 16px 8px 10px;
  font-size: 18px; font-weight: 600;
  transition: background .08s, border-color .08s;
}
.opt .k {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: var(--muted);
  background: var(--surface);
}
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: .55; }
.pas {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); border: 2px solid var(--muted); border-radius: 14px;
  min-height: 54px; font-weight: 700; font-size: 17px; color: var(--ink);
  box-shadow: 0 3px 0 var(--muted);
  transition: transform .08s, box-shadow .08s;
}
.pas svg { width: 20px; height: 20px; }
.pas:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--muted); }
.pas.picked { background: var(--skip-bg); border: 2px solid var(--skip); color: var(--skip); box-shadow: 0 3px 0 var(--skip); }
.sheet {
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  padding: 14px; display: grid; gap: 8px;
}
.sheet p { font-weight: 600; }

/* ---------- Sonuç ---------- */
.res { display: flex; flex-direction: column; gap: 22px; }
.score { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--line); }
.ring .val { stroke: var(--accent); transition: stroke-dasharray .6s; }
.ring .pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums;
}
.score h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
.score .meta { color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  text-align: left; background: var(--surface); border: 2px solid var(--line);
  border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-height: 84px;
}
.stat b { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; font-weight: 600; }
.stat.ok { color: var(--ok); } .stat.bad { color: var(--bad); } .stat.skip { color: var(--skip); }
.stat[aria-pressed="true"].ok { background: var(--ok-bg); border-color: var(--ok); }
.stat[aria-pressed="true"].bad { background: var(--bad-bg); border-color: var(--bad); }
.stat[aria-pressed="true"].skip { background: var(--skip-bg); border-color: var(--skip); }
.hint { color: var(--muted); font-size: 14px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.entry { background: var(--surface); border: 2px solid var(--line); border-left-width: 6px; border-radius: 14px; padding: 14px 14px 14px 16px; display: grid; gap: 6px; }
.entry.k-ok { border-left-color: var(--ok); } .entry.k-bad { border-left-color: var(--bad); } .entry.k-skip { border-left-color: var(--skip); }
.e-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.e-word { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.e-tr { font-size: 18px; font-weight: 700; color: var(--accent); }
.e-en { font-style: italic; }
.e-trs { color: var(--muted); }
.e-yours { font-size: 14px; color: var(--bad); font-weight: 600; margin-top: 2px; }
.e-yours s { text-decoration-thickness: 2px; }
.empty { color: var(--muted); padding: 14px 0; }
.actions { display: grid; gap: 10px; }

/* Kart geçişi: eski kart sola uçar, yenisi sağdan gelir */
.deck { position: relative; flex: 1; display: flex; flex-direction: column; margin: 0 14px 32px; }
.card {
  position: relative; z-index: 3; flex: 1;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px;
  padding: 16px;
  box-shadow: 0 18px 36px -18px rgba(20, 26, 48, .5);
}
/* Arkadaki kartlar: gerçek kartlar, öndekiyle aynı boyda, aşağıda ve küçük duruyor */
.card.back {
  position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 100%;
  box-shadow: none;
  background: color-mix(in srgb, var(--surface) 72%, var(--bg));
  transition: transform .2s cubic-bezier(.2,.8,.3,1), background .2s, box-shadow .2s;
}
.card.front { transform: translateX(-14px); }
.card.b1 { z-index: 2; transform: translate(0, 14px); }
.card.b2 { z-index: 1; transform: translate(14px, 28px); }
.card.b1 > * { opacity: 0; transition: opacity .2s; }
/* Öndeki uçarken: ikinci kart öne gelir, üçüncü ikinciye çıkar */
.card.b1.promote { transform: translateX(-14px); background: var(--surface); box-shadow: 0 18px 36px -18px rgba(20, 26, 48, .5); }
.card.b1.promote > * { opacity: 1; }
.card.b2.promote2 { transform: translate(0, 14px); }
.card.leave { animation: cardOut .17s ease-in forwards; }
@keyframes cardOut { to { transform: translateX(-110px) rotate(-6deg); opacity: 0; } }
#app { overflow-x: clip; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .card.leave, .card.enter { animation: none !important; }
}


/* v2: özel testler, uzun ana ekran */
.lv .nm { display: flex; flex-direction: column; }
.lv .nm small { font-weight: 500; font-size: 13px; color: var(--muted); }
.lv[aria-checked="true"] .nm small { color: inherit; opacity: .85; }
.lv .meta { display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
.lv .meta b { font-weight: 600; font-size: 13px; }
.lv .meta i { font-style: normal; }
.lv[aria-checked="true"] .meta { color: inherit; opacity: .9; }
.home .primary { position: sticky; bottom: 12px; box-shadow: 0 10px 24px -10px rgba(51, 71, 255, .6); }
.home { padding-bottom: 8px; }
.dirs { display: flex; gap: 8px; margin-top: 10px; }
.dirs .cnt { flex: 1; width: auto; height: auto; padding: 12px 6px; font-size: 14px; }
.lv[disabled] { opacity: .55; cursor: default; }
.lv.nav .meta b { font-size: 22px; }
.hl { color: var(--accent); font-weight: 800; }
.stage p { margin: 0; }
.word.sent { font-size: clamp(24px, 7vw, 32px); line-height: 1.3; letter-spacing: -0.01em; font-weight: 700; }
.word.tr { font-size: clamp(34px, 10vw, 48px); }
.sub { font-size: 16px; font-style: italic; }
.tag { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seen { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.seen b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sub2 { font-size: 15px; color: var(--muted); }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--accent); transform: translateY(2px); }
.e-note { font-size: 14px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.e-note b { color: var(--ink); }
/* v37: günlük hedef, ilerleme, sözlük */
.goal { display: grid; gap: 8px; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; }
div.goal { cursor: default; }
.g-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; }
.g-top span { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.g-bar { display: block; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.g-bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s; }
.g-bar > span.done { background: var(--ok); }
.g-sub { font-size: 13px; color: var(--muted); }
.goaldone { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); font-weight: 700; text-align: center; }
.wk { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 150px; margin-top: 10px; }
.wkcol { display: flex; flex-direction: column; align-items: center; height: 150px; }
.wkv { height: 16px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.wkbar { height: 116px; width: 100%; max-width: 30px; display: flex; align-items: flex-end; }
.wkbar > span { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
.wkbar > span.met { background: var(--ok); }
.wkl { height: 18px; line-height: 18px; font-size: 12px; color: var(--muted); }
.wkgoal { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--muted); opacity: .6; pointer-events: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; display: grid; gap: 2px; text-align: center; }
.tile b { font-size: 28px; font-variant-numeric: tabular-nums; color: var(--ink); }
.tile span { font-size: 13px; color: var(--muted); }
.tile.known { border-top: 6px solid var(--ok); } .tile.learn { border-top: 6px solid var(--accent); } .tile.hard { border-top: 6px solid var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sg.known { background: var(--ok); } .sg.learn { background: var(--accent); } .sg.hard { background: var(--bad); }
.lvs { display: grid; gap: 10px; margin-top: 8px; }
.lvrow { display: grid; grid-template-columns: 30px 1fr 44px; align-items: center; gap: 10px; }
.lvid { font-weight: 800; }
.stack { display: flex; gap: 2px; height: 14px; border-radius: 4px; background: var(--line); overflow: hidden; }
.stack .sg { height: 100%; }
.lvacc { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.acclist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.acclist li { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.acclist b { font-variant-numeric: tabular-nums; }
#dq { margin-top: 4px; }
.dlist { margin-top: 12px; }
.dsrc { margin: 0; font-size: 12px; color: var(--muted); }
.dst.known { color: var(--ok); font-weight: 700; } .dst.hard { color: var(--bad); font-weight: 700; } .dst.learn { color: var(--accent); font-weight: 700; }
/* v35: soru şekilleri, yazarak cevap, dinleme, eşleştirme */
.styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.styles .cnt { width: auto; height: auto; min-height: 44px; padding: 10px 4px; font-size: 14px; }
.styles .cnt:disabled { opacity: .45; }
.hint2 { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.hintw { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 22px; letter-spacing: .18em; font-weight: 700; color: var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
.tform { display: grid; gap: 10px; }
.tin { width: 100%; box-sizing: border-box; font: inherit; font-size: 20px; font-weight: 600; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-height: 54px; }
.tin:focus { outline: none; border-color: var(--accent); }
.tbox { height: 54px; border-radius: 14px; border: 2px dashed var(--line); }
.tfb { display: grid; gap: 8px; padding: 14px 16px; border-radius: 14px; border: 2px solid; font-size: 17px; text-align: left; }
.tfb.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.tfb.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--ink); }
.tfb.skip { border-color: var(--skip); background: var(--skip-bg); color: var(--ink); }
.tfb b[lang] { font-size: 19px; }
.tfb .primary { margin-top: 4px; }
.bigspk { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.bigspk svg { width: 44px; height: 44px; }
.bigspk:active { transform: translateY(3px); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.mstage { flex: 0; min-height: 0; padding: 6px 0 2px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
.mcol { display: grid; gap: 8px; align-content: start; }
.mbtn { font: inherit; font-size: 15px; font-weight: 600; line-height: 1.2; min-height: 52px; padding: 6px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; overflow-wrap: break-word; word-break: normal; hyphens: manual; text-align: center; }
@media (max-width: 360px) { .mgrid { gap: 6px; } .mcol { gap: 6px; } .mbtn { font-size: 13.5px; padding: 5px 4px; letter-spacing: -0.01em; } }
@media (max-height: 600px) { .mbtn { min-height: 44px; } .mstage { padding: 0; } .mstage .sub2 { font-size: 13px; } }
.mbtn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.mbtn.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); opacity: .75; }
.mbtn.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.pas[hidden] { display: none; }
/* v26: hata bayrağı */

<script>(function(){try{var t=JSON.parse(localStorage.getItem("kelime-theme"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>

<script>
(function () {
  'use strict';

  var D = window.KELIME_DATA;
  var LEVELS = [
    { id: 'A1', name: 'Başlangıç' },
    { id: 'A2', name: 'Temel' },
    { id: 'B1', name: 'Orta' },
    { id: 'B2', name: 'Orta üstü' },
    { id: 'C1', name: 'İleri' }
  ];
  var MODES = [
    { id: 'irreg', code: 'V2', name: 'Düzensiz fiiller', note: 'Geçmiş zaman biçimleri' },
    { id: 'syn', code: '≈', name: 'Anlamı yakın kelimeler', note: 'Cümleye uyan kelimeyi seç' },
    { id: 'spell', code: 'th', name: 'Yazılışı benzer kelimeler', note: 'Doğru yazılışı bul' },
    { id: 'orig', code: 'Old', name: 'Orijinal anlamlar', note: 'Kelimenin eski anlamı ne?' },
    { id: 'poly', code: '1+', name: 'Çok anlamlı kelimeler', note: 'Anlamı OLMAYANI bul' },
    { id: 'ant', code: '⇄', name: 'Zıt anlamlılar', note: 'Tersi hangisi?' },
    { id: 'simile', code: 'as', name: 'Benzetmeler', note: 'as … as … kalıpları' },
    { id: 'idiom', code: 'Dy', name: 'Deyimler', note: 'Kalıplaşmış ifadeler' },
    { id: 'phrasal', code: 'Up', name: 'Phrasal verbs', note: 'give up, look after…' },
    { id: 'prep', code: 'at', name: 'Edatlar', note: 'in, on, at ve kalıplar' },
    { id: 'form', code: 'Tür', name: 'Kelime türleri', note: 'happy → happiness' },
    { id: 'coll', code: 'do', name: 'Kalıp kelimeler', note: 'make, do, take; heavy rain…' }
  ];
  var STYLES = [
    { id: 'mc', name: 'Şıklı' },
    { id: 'type', name: 'Yazarak' },
    { id: 'listen', name: 'Dinleyerek' },
    { id: 'fill', name: 'Boşluk doldur' },
    { id: 'match', name: 'Eşleştirme' }
  ];
  var STYLE_NAME = {};
  STYLES.forEach(function (x) { STYLE_NAME[x.id] = x.name; });
  var CAN_SPEAK = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  var TOPICS = window.KELIME_TOPICS || [];
  var COUNTS = [10, 20, 30, 40, 50];
  var LABEL = {};
  LEVELS.forEach(function (l) { LABEL[l.id] = l.id; });
  MODES.forEach(function (m) { LABEL[m.id] = m.name; });
  TOPICS.forEach(function (t) { LABEL['tp-' + t.id] = t.name; });
  LABEL.wrong = 'Yanlışlarım';

  // ---------- yardımcılar ----------
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function lines(t) { return t.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); }

  // ---------- veri ----------
  var NOT_COG = { cure: 1 }; // yazılışı İngilizceye tesadüfen benzeyenler, not gösterilmez
  var COG_YES = { 'Jerusalem / Al-Quds': 1, 'Mecca / Makkah': 1 }; // otomatik yakalanmayan benzerler
  var POOL = {};
  LEVELS.forEach(function (l) {
    POOL[l.id] = lines(D.vocab[l.id]).map(function (s) {
      var p = s.split('|');
      return { kind: 'vocab', key: l.id + '|' + p[0], level: l.id, en: p[0], tr: p[1], ex: p[2], exTr: p[3], cog: cognate(p[0], p[1]) };
    });
  });

  var VERBS = lines(D.irreg).map(function (s) {
    var p = s.split('|');
    return { base: p[0], v2: p[1], v3: p[2], tr: p[3] };
  });
  POOL.irreg = [];
  VERBS.forEach(function (v) {
    [2, 3].forEach(function (a) { POOL.irreg.push({ kind: 'irreg', key: 'irreg|' + v.base + '|' + a, v: v, ask: a }); });
  });

  var EXTRA = window.KELIME_EXTRA || { syn: '', poly: '', ant: '', antCl: [] };
  function nearWords(a, b) {
    var cl = EXTRA.antCl || [];
    for (var i = 0; i < cl.length; i++) { if (cl[i].indexOf(a) >= 0 && cl[i].indexOf(b) >= 0) return true; }
    return false;
  }
  // ---------- aynı anlamdaki kelimeler aynı soruda şık olmasın ----------
  var TRM = { 'İ': 'i', 'I': 'i', 'ı': 'i', 'Ş': 's', 'ş': 's', 'Ç': 'c', 'ç': 'c', 'Ğ': 'g', 'ğ': 'g', 'Ö': 'o', 'ö': 'o', 'Ü': 'u', 'ü': 'u', 'Â': 'a', 'â': 'a', 'Î': 'i', 'î': 'i', 'Û': 'u', 'û': 'u' };
  function phr(tr) {
    var t = String(tr).replace(/\([^)]*\)/g, '').replace(/[İIıŞşÇçĞğÖöÜüÂâÎîÛû]/g, function (c) { return TRM[c]; }).toLowerCase();
    return t.split(/[,;\/]/).map(function (x) { return x.replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim(); }).filter(Boolean);
  }
  var SIMIX = {};
  (EXTRA.sim || []).forEach(function (c, i) { c.forEach(function (w) { w = w.toLowerCase(); (SIMIX[w] = SIMIX[w] || []).push(i); }); });
  function sameCl(a, b) {
    var x = SIMIX[String(a).toLowerCase()], y = SIMIX[String(b).toLowerCase()];
    if (!x || !y) return false;
    for (var i = 0; i < x.length; i++) if (y.indexOf(x[i]) >= 0) return true;
    return false;
  }
  var PH = {};
  function phrOf(it) { return PH[it.key] || (PH[it.key] = phr(it.tr)); }
  function tooClose(a, b) {
    if (a.en.toLowerCase() === b.en.toLowerCase() || a.tr === b.tr || sameCl(a.en, b.en)) return true;
    var p = phrOf(a), q = phrOf(b);
    for (var i = 0; i < p.length; i++) if (q.indexOf(p[i]) >= 0) return true;
    return false;
  }
  // ---------- akıllı şık: aynı anlam grubu > aynı tür > diğerleri ----------
  var TAGS = EXTRA.tags || {}, CAT = {};
  function posTr(tr) {
    var ps = String(tr).replace(/\([^)]*\)/g, '').split(/[,;]/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (ps.length && ps.every(function (x) { return /(mak|mek)$/.test(x); })) return 'v';
    if (ps.length && /^[^ ]+(lı|li|lu|lü|sız|siz|suz|süz|sal|sel)$/.test(ps[0])) return 'a';
    return 'n';
  }
  var TTAGS = EXTRA.ttags || {};
  function catOf(en, tr, pid) {
    var k = (pid || '') + '|' + en + '|' + tr;
    if (CAT[k] === undefined) {
      var c = pid ? null : TAGS[String(en).toLowerCase()];
      if (!c) {
        c = posTr(tr);
        if (c === 'n' && /^[a-z]+(ous|ive|ful|less|able|ible)$/.test(String(en).toLowerCase())) c = 'a';
        var sub = pid && pid.indexOf('tp-') === 0 ? (TTAGS[pid.slice(3)] || {})[en] : null;
        if (sub) c += '.' + sub;
      }
      CAT[k] = c;
    }
    return CAT[k];
  }
  function catScore(a, b) {
    var x = a.split('.'), y = b.split('.'), s = 0;
    for (var i = 0; i < Math.min(x.length, y.length) && x[i] === y[i]; i++) s += 2;
    return s;
  }
  function wcB(t) { return Math.min(3, String(t).replace(/\([^)]*\)/g, '').trim().split(/\s+/).length); }
  function pickDecoys(it, pool, n, side) {
    // Cevap Türkçeye benzeyen bir kelimeyse şıklar da benzerlerden; sonra aynı anlam grubu ve tür; sonra aynı kelime sayısı
    var want = !!it.cog, ci = catOf(it.en, it.tr, it.pid), cands = [], spare = [];
    pool.forEach(function (w) {
      if (w === it || w.en === it.en || w.tr === it.tr) return;
      if (tooClose(it, w)) { spare.push(w); return; }
      var sc = (!!w.cog === want ? 10 : 0) + catScore(ci, catOf(w.en, w.tr, w.pid)) + (side && wcB(w[side]) === wcB(it[side]) ? 1 : 0) + Math.random() * 0.9;
      cands.push([sc, w]);
    });
    cands.sort(function (a, b) { return b[0] - a[0]; });
    var out = [];
    for (var i = 0; i < cands.length && out.length < n; i++) {
      var w = cands[i][1], ok = true;
      for (var j = 0; j < out.length; j++) if (tooClose(out[j], w)) { ok = false; break; }
      if (ok) out.push(w);
    }
    for (var k = 0; out.length < n && k < spare.length; k++) if (spare[k].tr !== it.tr && spare[k].en !== it.en) out.push(spare[k]);
    return out;
  }
  var SYN = [];
  (function () {
    var cur = null;
    lines(D.syn + '\n' + EXTRA.syn).forEach(function (l) {
      if (l[0] === '@') { cur = { title: l.slice(1).trim(), w: [], n: {}, q: [] }; SYN.push(cur); }
      else if (l[0] === '=') { var p = l.slice(1).split('|'); cur.w.push(p[0].trim()); cur.n[p[0].trim()] = p[1]; }
      else if (l[0] === '?') { var q = l.slice(1).split('|'); cur.q.push({ s: q[0].trim(), a: q[1], t: q[2] }); }
    });
  })();
  POOL.syn = [];
  SYN.forEach(function (g, gi) {
    g.q.forEach(function (q, qi) { POOL.syn.push({ kind: 'syn', key: 'syn|' + gi + '|' + qi, g: g, s: q.s, a: q.a, trS: q.t }); });
  });

  var SPELL = [];
  (function () {
    var cur = null;
    lines(D.spell).forEach(function (l) {
      if (l[0] === '@') { cur = { title: l.slice(1).trim(), i: [] }; SPELL.push(cur); }
      else { var p = l.split('|'); cur.i.push({ w: p[0], tr: p[1], ex: p[2], exTr: p[3] }); }
    });
  })();
  POOL.spell = [];
  SPELL.forEach(function (g) {
    g.i.forEach(function (x) { POOL.spell.push({ kind: 'spell', key: 'spell|' + x.w, g: g, w: x.w, tr: x.tr, ex: x.ex, exTr: x.exTr }); });
  });

  function norm(s) {
    return s.toLowerCase().replace(/[ıİ]/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/[üû]/g, 'u').replace(/[âá]/g, 'a').replace(/î/g, 'i').replace(/[^a-z]/g, '');
  }
  function lev(a, b) {
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (j = 1; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function cognate(en, tr) {
    if (NOT_COG[en]) return false;
    if (COG_YES[en]) return true;
    var x = norm(en), y = norm(tr);
    if (!x || !y) return false;
    return lev(x, y) <= Math.floor(Math.max(x.length, y.length) * 0.4);
  }
  TOPICS.forEach(function (t) {
    POOL['tp-' + t.id] = lines(t.items).map(function (s) {
      var p = s.split('|');
      return { kind: 'topic', key: 'topic|' + t.id + '|' + p[0], tname: t.name, en: p[0], tr: p[1], ex: p[2], exTr: p[3], pid: 'tp-' + t.id, cog: cognate(p[0], p[1]) };
    });
  });

  POOL.orig = lines(window.KELIME_ORIG || '').map(function (s) {
    var p = s.split('|');
    return { kind: 'orig', key: 'orig|' + p[0], w: p[0], old: p[1], mod: p[2], en: p[3], tr: p[4], note: p[5] };
  });

  POOL.poly = lines(EXTRA.poly).map(function (s) {
    var p = s.split('|');
    return { kind: 'poly', key: 'poly|' + p[0], w: p[0], t: p[1].split(';').map(function (x) { return x.trim(); }), d: p[2].split(';').map(function (x) { return x.trim(); }) };
  });
  ['simile', 'idiom'].forEach(function (pid) {
    POOL[pid] = lines(EXTRA[pid] || '').map(function (s) {
      var p = s.split('|');
      return { kind: 'idiom', key: pid + '|' + p[0], pid: pid, en: p[0], w: p[0], tr: p[1], lit: p[2], ex: p[3], exTr: p[4] };
    });
  });
  POOL.phrasal = lines(EXTRA.phrasal || '').map(function (s) {
    var p = s.split('|');
    return { kind: 'phr', key: 'phr|' + p[0], pid: 'phrasal', en: p[0], w: p[0], tr: p[1], ex: p[2], exTr: p[3] };
  });
  var SENT = { prep: 'Edat', form: 'Kelime türü', coll: 'Kalıp' };
  ['prep', 'form', 'coll'].forEach(function (id) {
    POOL[id] = lines(EXTRA[id] || '').map(function (s) {
      var p = s.split('|');
      return { kind: id, key: id + '|' + p[0], s: p[0], a: p[1], d: p[2].split(','), trS: p[3], note: p[4] };
    });
  });
  POOL.ant = [];
  lines(EXTRA.ant).forEach(function (s) {
    var p = s.split('|');
    POOL.ant.push({ kind: 'ant', key: 'ant|' + p[0] + '|' + p[1], w: p[0], o: p[1], trW: p[2], trO: p[3] });
    POOL.ant.push({ kind: 'ant', key: 'ant|' + p[1] + '|' + p[0], w: p[1], o: p[0], trW: p[3], trO: p[2] });
  });

  // ---------- akıllı tekrar ----------
  // Önce hiç görülmeyenler; yanında bir miktar zorlanılan kelime; bilinenler aralıkları açılarak seyrek gelir.
  var stats = load('kelime-stats', {});
  function skey(it, style) { return style && style !== 'mc' ? style + ':' + it.key : it.key; }
  function streak(s) { return s.st != null ? s.st : (s.ok > s.bad ? 1 : 0); }
  function stage(it, style) {
    var s = stats[skey(it, style)];
    if (!s) return 'new';
    var st = streak(s);
    if (st === 0) return 'hard';
    if (st === 1) return 'learn';
    return 'known';
  }
  function overdue(it, style) {
    var s = stats[skey(it, style)], st = streak(s);
    return (Date.now() - s.t) / 864e5 - Math.pow(2, st - 1);
  }
  function pickItems(pool, n, style) {
    if (pool.length <= n) return shuffle(pool);
    var g = { 'new': [], hard: [], learn: [], known: [] };
    shuffle(pool).forEach(function (it) { g[stage(it, style)].push(it); });
    var byOld = function (a, b) { return stats[skey(a, style)].t - stats[skey(b, style)].t; };
    g.hard.sort(byOld); g.learn.sort(byOld);
    g.known.sort(function (a, b) { return overdue(b, style) - overdue(a, style); });
    var out = [];
    function take(arr, k) { while (k-- > 0 && arr.length && out.length < n) out.push(arr.shift()); }
    take(g.hard, Math.round(n * 0.3));
    take(g.learn, Math.round(n * 0.2));
    var due = g.known.filter(function (it) { return overdue(it, style) > 0; });
    take(due, Math.round(n * 0.1));
    g.known = g.known.filter(function (it) { return out.indexOf(it) < 0; });
    take(g['new'], n);
    take(g.hard, n); take(g.learn, n); take(g.known, n);
    return shuffle(out);
  }
  function record(it, ok, style) {
    var k = skey(it, style), s = stats[k] || (stats[k] = { n: 0, ok: 0, bad: 0, t: 0 });
    var st = s.n ? streak(s) : 0;
    s.n++; if (ok) s.ok++; else s.bad++;
    s.st = ok ? st + 1 : 0;
    s.t = Date.now();
    save('kelime-stats', stats);
    var dk = dayKey(0); days[dk] = (days[dk] || 0) + 1; save('kelime-days', days);
  }
  // ---------- günlük hedef ve seri ----------
  var days = load('kelime-days', {});
  var GOALS = [10, 20, 30, 50, 100];
  var goal = load('kelime-goal', 20);
  if (GOALS.indexOf(goal) < 0) goal = 20;
  function dayKey(back) {
    var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - back);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function todayN() { return days[dayKey(0)] || 0; }
  function streakDays() {
    var n = 0, b = (days[dayKey(0)] || 0) >= goal ? 0 : 1;
    while ((days[dayKey(b)] || 0) >= goal) { n++; b++; }
    return n;
  }
  var ALL = {};
  Object.keys(POOL).forEach(function (id) { POOL[id].forEach(function (it) { ALL[it.key] = it; }); });
  function itemInfo() {
    var m = {};
    Object.keys(stats).forEach(function (k) {
      var base = k.replace(/^(type|listen|fill|match):/, ''), s = stats[k];
      if (!ALL[base]) return;
      var x = m[base] || (m[base] = { ok: 0, bad: 0, t: 0, st: 0 });
      x.ok += s.ok; x.bad += s.bad;
      if (s.t >= x.t) { x.t = s.t; x.st = streak(s); }
    });
    return m;
  }
  function statusOf(info, it) { var x = info[it.key]; if (!x) return 'new'; return x.st >= 2 ? 'known' : x.st === 0 ? 'hard' : 'learn'; }
  function wrongItems() {
    var seen = {}, out = [];
    Object.keys(stats).forEach(function (k) {
      var s = stats[k], base = k.replace(/^(type|listen|fill|match):/, '');
      if (!ALL[base] || seen[base] || !(s.bad > s.ok || (s.st === 0 && s.bad > 0))) return;
      seen[base] = 1; out.push(ALL[base]);
    });
    return out;
  }
  var LVID = {}; LEVELS.forEach(function (l) { LVID[l.id] = 1; });
  function styleable(id) { return !!id && (!!LVID[id] || id.indexOf('tp-') === 0); }
  function styleFor(id) { return styleable(id) ? S.style : 'mc'; }
  function cloze3(it) {
    if (!it.ex || /\//.test(it.en)) return '';
    var re = new RegExp("(^|[^A-Za-z'])" + reEsc(it.en) + "(?![A-Za-z'])", 'gi');
    return re.test(it.ex) ? it.ex.replace(re, function (m, p) { return p + '___'; }) : '';
  }
  function poolFor(id, style) {
    var p = id === 'wrong' ? wrongItems() : POOL[id];
    if (style === 'fill') p = p.filter(function (it) { return !!cloze3(it); });
    return p;
  }

    if (q.style === 'type') {
      q.fb = '<div class="tfb skip"><span>Doğrusu: <b lang="en">' + esc(q.it.en) + '</b></span></div>';
      renderQuiz();
      timer = setTimeout(next, 1500);
      return;
    }
    var pb = document.getElementById('pas');
    if (pb) pb.classList.add('picked');
    app.querySelectorAll('.card.front .opt').forEach(function (b) { b.classList.add('dim'); });
    timer = setTimeout(next, 400);
  }

  // ---------- olaylar ----------
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (S.sound) unlockAudio();
    if (t.dataset.say) { speak(t.dataset.say); return; }
    if (t.dataset.level) { S.level = t.dataset.level; render(); return; }
    if (t.dataset.thm) { S.theme = t.dataset.thm; save('kelime-theme', S.theme); applyTheme(); render(); return; }
    if (t.dataset.go) {
      S.screen = t.dataset.go;
      if (S.screen === 'topics' && (!S.level || S.level.indexOf('tp-') !== 0)) S.level = null;
      render(); return;
    }
    if (t.dataset.goal) { goal = +t.dataset.goal; save('kelime-goal', goal); renderStats(); return; }
    if (t.dataset.style) { S.style = t.dataset.style; save('kelime-style', S.style); render(); return; }
    if (t.dataset.ml) { matchTap('l', +t.dataset.ml); return; }
    if (t.dataset.mr) { matchTap('r', +t.dataset.mr); return; }
    if (t.dataset.dir) { S.dir = t.dataset.dir; save('kelime-dir', S.dir); render(); return; }
    if (t.dataset.count) { S.count = +t.dataset.count; save('kelime-count', S.count); render(); return; }
    if (t.dataset.flag) {
      var fq = t.dataset.flag === 'live' ? S.qs[S.i] : S.qs[+t.dataset.flag.slice(1)];
      if (fq) toggleFlag(fq, t);
      return;
    }
    if (t.dataset.fdel) { delete S.flags[t.dataset.fdel]; save('kelime-flags', S.flags); S.fcopied = false; renderFlags(); return; }
    if (t.dataset.opt) { answer(+t.dataset.opt); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; renderResult(); return; }
    switch (t.id) {
      case 'snd':
        S.sound = !S.sound; save('kelime-sound', S.sound); render();
        if (S.sound) { unlockAudio(); setTimeout(swish, 150); }
        break;
      case 'start':
        var st0 = styleFor(S.level), sp = S.level ? poolFor(S.level, st0) : null;
        if (sp && sp.length) startTest(pickItems(sp, S.count, st0), S.level, st0);
        break;
      case 'tnext': next(); break;
      case 'pas': pass(); break;
      case 'fcopy': copyText(flagText(), function (ok) { S.fcopied = ok; renderFlags(); if (!ok) { var b = document.getElementById('fcopy'); if (b) b.textContent = 'Kopyalanamadı'; } }); break;
      case 'fclear':
        if (!S.fconfirm) { S.fconfirm = true; renderFlags(); }
        else { S.flags = {}; save('kelime-flags', S.flags); S.fconfirm = false; S.fcopied = false; renderFlags(); }
        break;
      case 'exit': S.confirm = true; render(); break;
      case 'resume': S.confirm = false; render(); break;
      case 'finish': S.confirm = false; finish(); break;
      case 'tohome': leaveHistory(); goHome(); break;
      case 'again':
        var pl = poolFor(S.testLevel, S.testStyle);
        if (pl.length) startTest(pickItems(pl, S.qs.length, S.testStyle), S.testLevel, S.testStyle); else goHome();
        break;
      case 'redo':
        var again = S.qs.filter(function (q) { var k = kindOf(q); return k === 'bad' || k === 'skip'; }).map(function (q) { return q.it; });
        startTest(again, S.testLevel, S.testStyle);
        break;
    }
  });
  var dqTimer = null;
  app.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'dq') return;
    S.dq = e.target.value;
    clearTimeout(dqTimer);
    dqTimer = setTimeout(function () { var r = document.getElementById('dres'); if (r) r.innerHTML = dictResults(); }, 120);
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = document.getElementById('tin');
    if (inp) checkTyped(inp.value);
  });
  document.addEventListener('keydown', function (e) {
    if (S.screen !== 'quiz' || S.confirm || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    var cq = S.qs[S.i];
    if (S.testStyle === 'match' || (cq && cq.style === 'type')) { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON' && document.getElementById('tnext')) next(); return; }
    var k = e.key.toLowerCase();
    var map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map) answer(map[k]);
    else if (k === 'p') pass();
  });

  // Ses kaydını sayfa açılır açılmaz çöz; bağlam ilk dokunuşa kadar uyur
  ['touchend', 'pointerup', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { if (S.sound) unlockAudio(); }, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.sound && audioCtx && audioCtx.state !== 'running') { try { audioCtx.resume(); } catch (e) {} }
    if (document.hidden) keepAlive(false); else keepAlive(S.screen === 'quiz');
  });
  if (S.sound) {
    try {
      var AC0 = window.AudioContext || window.webkitAudioContext;
      if (AC0) { audioCtx = new AC0(); loadCard(); }
    } catch (e) {}
  }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
