<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime Sınavı</title>
<meta name="theme-color" content="#3347ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelimeler">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: tek sütun, telefon öncelikli. Kelime ekranın ortasında dev tipografi, şıklar altta.
   Koyu mürekkep + kobalt vurgu; doğru/yanlış/pas için ayrı anlam renkleri. */
:root {
  --bg: #eef1f8;
  --surface: #ffffff;
  --ink: #151a30;
  --muted: #5d6584;
  --line: #d9deed;
  --accent: #3347ff;
  --accent-ink: #ffffff;
  --ok: #0f7a55;
  --ok-bg: #dcf3ea;
  --bad: #c0322a;
  --bad-bg: #fbe3e0;
  --skip: #8a6400;
  --skip-bg: #fbf0cf;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #181c32; --ink: #eceffd; --muted: #9aa3c7; --line: #2a3052;
    --accent: #7b8bff; --accent-ink: #0e1120;
    --ok: #4fd1a0; --ok-bg: #12362b; --bad: #ff8a80; --bad-bg: #3e1c1f; --skip: #f0c75a; --skip-bg: #3a3012;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #181c32; --ink: #eceffd; --muted: #9aa3c7; --line: #2a3052;
  --accent: #7b8bff; --accent-ink: #0e1120;
  --ok: #4fd1a0; --ok-bg: #12362b; --bad: #ff8a80; --bad-bg: #3e1c1f; --skip: #f0c75a; --skip-bg: #3a3012;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, p { margin: 0; }

#app {
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 28px;
  display: flex;
  flex-direction: column;
}

/* ---------- Ana ekran ---------- */
.home { display: flex; flex-direction: column; gap: 26px; flex: 1; }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 12vw, 58px);
  line-height: 1;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin-top: 8px;
}
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.snd {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 99px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-size: 14px; font-weight: 600;
}
.snd svg { width: 18px; height: 18px; }
.snd[aria-pressed="false"] { color: var(--muted); }
.label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.levels { display: flex; flex-direction: column; gap: 8px; }
.lv {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 10px 16px 10px 12px;
  min-height: 62px;
  transition: border-color .15s, background .15s;
}
.lv .code { font-family: var(--font-display); font-weight: 800; font-size: 32px; letter-spacing: -0.02em; }
.lv .nm { font-weight: 600; }
.lv .best { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lv[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lv[aria-checked="true"] .best { color: inherit; opacity: .85; }
.counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cnt {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 12px;
  min-height: 52px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}
.cnt[aria-checked="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 14px;
  min-height: 56px;
  padding: 0 20px;
  font-weight: 700;
  font-size: 17px;
}
.ghost {
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 14px;
  min-height: 52px;
  padding: 0 20px;
  font-weight: 600;
}
.home .primary { margin-top: auto; }

/* ---------- Test ekranı ---------- */
.quiz { display: flex; flex-direction: column; flex: 1; gap: 12px; }
.qhead { display: flex; align-items: center; gap: 12px; }
.qhead .exit { background: none; border: 0; padding: 8px 4px; font-weight: 600; color: var(--muted); min-height: 44px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.qcount { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 54px; text-align: right; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px 0; min-height: 200px; }
.tag { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); border: 1.5px solid var(--line); border-radius: 99px; padding: 2px 12px; }
.word {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(44px, 14vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.spk {
  width: 44px; height: 44px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--bg); border: 1.5px solid var(--line); color: var(--muted);
}
.spk svg { width: 20px; height: 20px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px;
  text-align: left;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 14px;
  min-height: 58px;
  padding: 8px 16px 8px 10px;
  font-size: 18px; font-weight: 600;
  transition: background .08s, border-color .08s;
}
.opt .k {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: var(--muted);
  background: var(--surface);
}
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: .55; }
.pas {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); border: 2px solid var(--muted); border-radius: 14px;
  min-height: 54px; font-weight: 700; font-size: 17px; color: var(--ink);
  box-shadow: 0 3px 0 var(--muted);
  transition: transform .08s, box-shadow .08s;
}
.pas svg { width: 20px; height: 20px; }
.pas:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--muted); }
.pas.picked { background: var(--skip-bg); border: 2px solid var(--skip); color: var(--skip); box-shadow: 0 3px 0 var(--skip); }
.sheet {
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  padding: 14px; display: grid; gap: 8px;
}
.sheet p { font-weight: 600; }

/* ---------- Sonuç ---------- */
.res { display: flex; flex-direction: column; gap: 22px; }
.score { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--line); }
.ring .val { stroke: var(--accent); transition: stroke-dasharray .6s; }
.ring .pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums;
}
.score h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
.score .meta { color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  text-align: left; background: var(--surface); border: 2px solid var(--line);
  border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-height: 84px;
}
.stat b { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; font-weight: 600; }
.stat.ok { color: var(--ok); } .stat.bad { color: var(--bad); } .stat.skip { color: var(--skip); }
.stat[aria-pressed="true"].ok { background: var(--ok-bg); border-color: var(--ok); }
.stat[aria-pressed="true"].bad { background: var(--bad-bg); border-color: var(--bad); }
.stat[aria-pressed="true"].skip { background: var(--skip-bg); border-color: var(--skip); }
.hint { color: var(--muted); font-size: 14px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.entry { background: var(--surface); border: 2px solid var(--line); border-left-width: 6px; border-radius: 14px; padding: 14px 14px 14px 16px; display: grid; gap: 6px; }
.entry.k-ok { border-left-color: var(--ok); } .entry.k-bad { border-left-color: var(--bad); } .entry.k-skip { border-left-color: var(--skip); }
.e-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.e-word { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.e-tr { font-size: 18px; font-weight: 700; color: var(--accent); }
.e-en { font-style: italic; }
.e-trs { color: var(--muted); }
.e-yours { font-size: 14px; color: var(--bad); font-weight: 600; margin-top: 2px; }
.e-yours s { text-decoration-thickness: 2px; }
.empty { color: var(--muted); padding: 14px 0; }
.actions { display: grid; gap: 10px; }

/* Kart geçişi: eski kart sola uçar, yenisi sağdan gelir */
.deck { position: relative; flex: 1; display: flex; flex-direction: column; margin: 0 14px 32px; }
.card {
  position: relative; z-index: 3; flex: 1;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px;
  padding: 16px;
  box-shadow: 0 18px 36px -18px rgba(20, 26, 48, .5);
}
/* Arkadaki kartlar: gerçek kartlar, öndekiyle aynı boyda, aşağıda ve küçük duruyor */
.card.back {
  position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 100%;
  box-shadow: none;
  background: color-mix(in srgb, var(--surface) 72%, var(--bg));
  transition: transform .2s cubic-bezier(.2,.8,.3,1), background .2s, box-shadow .2s;
}
.card.front { transform: translateX(-14px); }
.card.b1 { z-index: 2; transform: translate(0, 14px); }
.card.b2 { z-index: 1; transform: translate(14px, 28px); }
.card.b1 > * { opacity: 0; transition: opacity .2s; }
/* Öndeki uçarken: ikinci kart öne gelir, üçüncü ikinciye çıkar */
.card.b1.promote { transform: translateX(-14px); background: var(--surface); box-shadow: 0 18px 36px -18px rgba(20, 26, 48, .5); }
.card.b1.promote > * { opacity: 1; }
.card.b2.promote2 { transform: translate(0, 14px); }
.card.leave { animation: cardOut .17s ease-in forwards; }
@keyframes cardOut { to { transform: translateX(-110px) rotate(-6deg); opacity: 0; } }
#app { overflow-x: clip; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .card.leave, .card.enter { animation: none !important; }
}


/* v2: özel testler, uzun ana ekran */
.lv .nm { display: flex; flex-direction: column; }
.lv .nm small { font-weight: 500; font-size: 13px; color: var(--muted); }
.lv[aria-checked="true"] .nm small { color: inherit; opacity: .85; }
.lv .meta { display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
.lv .meta b { font-weight: 600; font-size: 13px; }
.lv .meta i { font-style: normal; }
.lv[aria-checked="true"] .meta { color: inherit; opacity: .9; }
.home .primary { position: sticky; bottom: 12px; box-shadow: 0 10px 24px -10px rgba(51, 71, 255, .6); }
.home { padding-bottom: 8px; }
.dirs { display: flex; gap: 8px; margin-top: 10px; }
.dirs .cnt { flex: 1; width: auto; height: auto; padding: 12px 6px; font-size: 14px; }
.lv[disabled] { opacity: .55; cursor: default; }
.lv.nav .meta b { font-size: 22px; }
.hl { color: var(--accent); font-weight: 800; }
.stage p { margin: 0; }
.word.sent { font-size: clamp(24px, 7vw, 32px); line-height: 1.3; letter-spacing: -0.01em; font-weight: 700; }
.word.tr { font-size: clamp(34px, 10vw, 48px); }
.sub { font-size: 16px; font-style: italic; }
.tag { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seen { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.seen b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sub2 { font-size: 15px; color: var(--muted); }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--accent); transform: translateY(2px); }
.e-note { font-size: 14px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.e-note b { color: var(--ink); }
/* v26: hata bayrağı */
.flagb { background: none; border: 0; min-width: 40px; min-height: 44px; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
.flagb svg { width: 22px; height: 22px; }
.flagb[aria-pressed="true"] { color: var(--bad); }
.flagb[aria-pressed="true"] svg path:nth-child(2) { fill: currentColor; }
.e-btns { display: flex; align-items: center; gap: 0; }
.fdel { background: none; border: 0; color: var(--bad); font-weight: 600; padding: 8px 4px; min-height: 40px; cursor: pointer; font: inherit; font-weight: 600; }
/* v25: konu ekranındaki geri düğmesi */
.toprow .exit { background: none; border: 0; padding: 8px 4px; font: inherit; font-weight: 600; font-size: 16px; color: var(--muted); min-height: 44px; cursor: pointer; }
/* v18: dar ekranda uzun şık kırılsın, kısa ekranda kart sığsın */
.word.mid { font-size: clamp(32px, 10vw, 54px); }
.primary:disabled { opacity: .5; box-shadow: none; cursor: default; }
.stage .cog { font-size: 13px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 99px; padding: 4px 12px; }
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 340px) { .opt { font-size: 16px; padding-right: 12px; } .card { padding: 12px; } }
@media (max-height: 800px) {
  #app { padding-top: 10px; padding-bottom: 12px; }
  .quiz { gap: 8px; }
  .deck { margin-bottom: 22px; }
  .card { padding: 12px; gap: 8px; }
  .stage { padding: 6px 0; min-height: 120px; gap: 8px; }
  .word { font-size: clamp(34px, 11vw, 60px); }
  .word.tr { font-size: clamp(28px, 8.5vw, 40px); }
  .word.sent { font-size: clamp(21px, 6vw, 28px); }
  .word.mid { font-size: clamp(28px, 9vw, 44px); }
  .opts { gap: 8px; }
  .opt { min-height: 48px; padding-top: 6px; padding-bottom: 6px; font-size: 17px; }
  .pas { min-height: 48px; }
  .spk { width: 40px; height: 40px; }
}
@media (max-height: 600px) {
  .stage { min-height: 90px; padding: 2px 0; }
  .word { font-size: clamp(30px, 10vw, 48px); }
  .opt { min-height: 44px; font-size: 16px; }
  .tag { font-size: 12px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>(function(){try{var t=JSON.parse(localStorage.getItem("kelime-theme"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<script src="sound.js"></script>
<script src="data.js"></script>
<script src="topics.js"></script>
<script src="orig.js"></script>
<script src="extra.js"></script>
<script>
(function () {
  'use strict';

  var D = window.KELIME_DATA;
  var LEVELS = [
    { id: 'A1', name: 'Başlangıç' },
    { id: 'A2', name: 'Temel' },
    { id: 'B1', name: 'Orta' },
    { id: 'B2', name: 'Orta üstü' },
    { id: 'C1', name: 'İleri' }
  ];
  var MODES = [
    { id: 'irreg', code: 'V2', name: 'Düzensiz fiiller', note: 'Geçmiş zaman biçimleri' },
    { id: 'syn', code: '≈', name: 'Anlamı yakın kelimeler', note: 'Cümleye uyan kelimeyi seç' },
    { id: 'spell', code: 'th', name: 'Yazılışı benzer kelimeler', note: 'Doğru yazılışı bul' },
    { id: 'orig', code: 'Old', name: 'Orijinal anlamlar', note: 'Kelimenin eski anlamı ne?' },
    { id: 'poly', code: '1+', name: 'Çok anlamlı kelimeler', note: 'Anlamı OLMAYANI bul' },
    { id: 'ant', code: '⇄', name: 'Zıt anlamlılar', note: 'Tersi hangisi?' },
    { id: 'simile', code: 'as', name: 'Benzetmeler', note: 'as … as … kalıpları' },
    { id: 'idiom', code: 'Dy', name: 'Deyimler', note: 'Kalıplaşmış ifadeler' }
  ];
  var TOPICS = window.KELIME_TOPICS || [];
  var COUNTS = [10, 20, 30, 40, 50];
  var LABEL = {};
  LEVELS.forEach(function (l) { LABEL[l.id] = l.id; });
  MODES.forEach(function (m) { LABEL[m.id] = m.name; });
  TOPICS.forEach(function (t) { LABEL['tp-' + t.id] = t.name; });
  LABEL.wrong = 'Yanlışlarım';

  // ---------- yardımcılar ----------
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function lines(t) { return t.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); }

  // ---------- veri ----------
  var NOT_COG = { cure: 1 }; // yazılışı İngilizceye tesadüfen benzeyenler, not gösterilmez
  var COG_YES = { 'Jerusalem / Al-Quds': 1, 'Mecca / Makkah': 1 }; // otomatik yakalanmayan benzerler
  var POOL = {};
  LEVELS.forEach(function (l) {
    POOL[l.id] = lines(D.vocab[l.id]).map(function (s) {
      var p = s.split('|');
      return { kind: 'vocab', key: l.id + '|' + p[0], level: l.id, en: p[0], tr: p[1], ex: p[2], exTr: p[3], cog: cognate(p[0], p[1]) };
    });
  });

  var VERBS = lines(D.irreg).map(function (s) {
    var p = s.split('|');
    return { base: p[0], v2: p[1], v3: p[2], tr: p[3] };
  });
  POOL.irreg = [];
  VERBS.forEach(function (v) {
    [2, 3].forEach(function (a) { POOL.irreg.push({ kind: 'irreg', key: 'irreg|' + v.base + '|' + a, v: v, ask: a }); });
  });

  var EXTRA = window.KELIME_EXTRA || { syn: '', poly: '', ant: '', antCl: [] };
  function nearWords(a, b) {
    var cl = EXTRA.antCl || [];
    for (var i = 0; i < cl.length; i++) { if (cl[i].indexOf(a) >= 0 && cl[i].indexOf(b) >= 0) return true; }
    return false;
  }
  // ---------- aynı anlamdaki kelimeler aynı soruda şık olmasın ----------

  // ---------- soru ekranı ----------

  function renderQuiz() {

  // ---------- sonuç ekranı ----------

  }

  }
  function spkBtn(w) { return '<button class="spk" data-say="' + esc(w) + '" aria-label="Telaffuzu dinle">' + SPEAKER + '</button>'; }

  var FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>';
  function flagData(q) {
    var it = q.it, d;
    if (q.kind === 'vocab') d = { t: it.level, w: it.en, a: it.tr };
    else if (q.kind === 'topic') d = { t: it.tname, w: it.en, a: it.tr };
    else if (q.kind === 'irreg') d = { t: 'Düzensiz fiil', w: it.v.base + ' · ' + it.v.v2 + ' · ' + it.v.v3, a: it.v.tr };

    else if (q.kind === 'idiom') d = { t: it.pid === 'simile' ? 'Benzetme' : 'Deyim', w: it.en, a: it.tr };

  function copyText(txt, done) {

  function entryHTML(q, kind) {

  function renderResult() {

      '<circle class="val" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (CIRC * pct / 100) + ' ' + CIRC + '"/></svg>' +

  }

  function render() {

  function finish() {
    clearTimeout(timer);
    var c = counts();
    if (c.done === S.qs.length) {
      var pct = Math.round(c.ok / S.qs.length * 100);
      if (S.testLevel !== 'wrong' && (best[S.testLevel] == null || pct > best[S.testLevel])) { best[S.testLevel] = pct; save('kelime-best', best); }
    }
    S.tab = c.bad > 0 ? 'bad' : (c.skip > 0 ? 'skip' : 'ok');
    S.screen = 'result';
    render();
  }
  function next() {
    swish();
    var go = function () {
      S.i++; S.locked = false;
      if (S.i >= S.qs.length) finish(); else render();
    };
    var front = app.querySelector('.card.front');
    if (front && !reduceMotion) {
      front.classList.add('leave');
      var b1 = app.querySelector('.card.b1'), b2 = app.querySelector('.card.b2');
      if (b1) b1.classList.add('promote');
      if (b2) b2.classList.add('promote2');
      timer = setTimeout(go, 210);
    } else go();
  }
  function answer(k) {
    if (S.locked || S.confirm) return;
    S.locked = true;
    var q = S.qs[S.i];
    q.chosen = k;
    record(q.it, k === q.correct);
    app.querySelectorAll('.card.front .opt').forEach(function (b, idx) {
      if (idx === q.correct) b.classList.add('right');
      else if (idx === k) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    timer = setTimeout(next, k === q.correct ? 500 : 650);
  }
  function pass() {
    if (S.locked || S.confirm) return;
    S.locked = true;
    var q = S.qs[S.i];
    q.chosen = -1;
    record(q.it, false);
    var pb = document.getElementById('pas');
    if (pb) pb.classList.add('picked');
    app.querySelectorAll('.card.front .opt').forEach(function (b) { b.classList.add('dim'); });
    timer = setTimeout(next, 400);
  }

  // ---------- olaylar ----------
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (S.sound) unlockAudio();
    if (t.dataset.say) { speak(t.dataset.say); return; }
    if (t.dataset.level) { S.level = t.dataset.level; render(); return; }
    if (t.dataset.thm) { S.theme = t.dataset.thm; save('kelime-theme', S.theme); applyTheme(); render(); return; }
    if (t.dataset.go) {
      S.screen = t.dataset.go;
      if (S.screen === 'topics' && (!S.level || S.level.indexOf('tp-') !== 0)) S.level = null;
      render(); return;
    }
    if (t.dataset.dir) { S.dir = t.dataset.dir; save('kelime-dir', S.dir); render(); return; }
    if (t.dataset.count) { S.count = +t.dataset.count; save('kelime-count', S.count); render(); return; }
    if (t.dataset.flag) {
      var fq = t.dataset.flag === 'live' ? S.qs[S.i] : S.qs[+t.dataset.flag.slice(1)];
      if (fq) toggleFlag(fq, t);
      return;
    }
    if (t.dataset.fdel) { delete S.flags[t.dataset.fdel]; save('kelime-flags', S.flags); S.fcopied = false; renderFlags(); return; }
    if (t.dataset.opt) { answer(+t.dataset.opt); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; renderResult(); return; }
    switch (t.id) {
      case 'snd':
        S.sound = !S.sound; save('kelime-sound', S.sound); render();
        if (S.sound) { unlockAudio(); setTimeout(swish, 150); }
        break;
      case 'start':
        var sp = S.level ? poolOf(S.level) : null;
        if (sp && sp.length) startTest(pickItems(sp, S.count), S.level);
        break;
      case 'pas': pass(); break;
      case 'fcopy': copyText(flagText(), function (ok) { S.fcopied = ok; renderFlags(); if (!ok) { var b = document.getElementById('fcopy'); if (b) b.textContent = 'Kopyalanamadı'; } }); break;
      case 'fclear':
        if (!S.fconfirm) { S.fconfirm = true; renderFlags(); }
        else { S.flags = {}; save('kelime-flags', S.flags); S.fconfirm = false; S.fcopied = false; renderFlags(); }
        break;
      case 'exit': if (!S.locked) { S.confirm = true; render(); } break;
      case 'resume': S.confirm = false; render(); break;
      case 'finish': S.confirm = false; finish(); break;
      case 'tohome': clearTimeout(timer); S.fconfirm = false; S.fcopied = false; S.screen = 'home'; S.confirm = false; S.level = null; render(); break;
      case 'again':
        var pl = poolOf(S.testLevel);
        if (pl.length) startTest(pickItems(pl, S.qs.length), S.testLevel); else { S.screen = 'home'; render(); }
        break;
      case 'redo':
        var again = S.qs.filter(function (q) { var k = kindOf(q); return k === 'bad' || k === 'skip'; }).map(function (q) { return q.it; });
        startTest(again, S.testLevel);
        break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (S.screen !== 'quiz' || S.confirm || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    var map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map) answer(map[k]);
    else if (k === 'p') pass();
  });

  // Ses kaydını sayfa açılır açılmaz çöz; bağlam ilk dokunuşa kadar uyur
  ['touchend', 'pointerup', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { if (S.sound) unlockAudio(); }, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.sound && audioCtx && audioCtx.state !== 'running') { try { audioCtx.resume(); } catch (e) {} }
    if (document.hidden) keepAlive(false); else keepAlive(S.screen === 'quiz');
  });
  if (S.sound) {
    try {
      var AC0 = window.AudioContext || window.webkitAudioContext;
      if (AC0) { audioCtx = new AC0(); loadCard(); }
    } catch (e) {}
  }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
